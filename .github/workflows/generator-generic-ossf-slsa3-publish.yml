# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow lets you generate SLSA provenance file for your project.
# The generation satisfies level 3 for the provenance requirements - see https://slsa.dev/spec/v0.1/requirements
# The project is an initiative of the OpenSSF (openssf.org) and is developed at
# https://github.com/slsa-framework/slsa-github-generator.
# The provenance file can be verified using https://github.com/slsa-framework/slsa-verifier.
# For more information about SLSA and how it improves the supply-chain, visit slsa.dev.

name: SLSA generic generator
on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - uses: actions/checkout@v4

      # ========================================================
      #
      # Step 1: Build your artifacts.
      #
      # ========================================================
      - name: Build artifacts
        run: |
            # These are some amazing artifacts.
            echo "artifact1" > artifact1
            echo "artifact2" > artifact2

      # ========================================================
      #
      # Step 2: Add a step to generate the provenance subjects
      #         as shown below. Update the sha256 sum arguments
      #         to include all binaries that you generate
      #         provenance for.
      #
      # ========================================================
      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail

          # List the artifacts the provenance will refer to.
          files=$(ls artifact*)
          # Generate the subjects (base64 encoded).
          echo "hashes=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}"

  provenance:
    needs: [build]
    permissions:
      actions: read   # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.4.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true # Optional: Upload to a new release
- name: SQLite Cloud - docs search
  # You may pin to the exact commit or the version.
  # uses: sqlitecloud/docsearch-action@f3c6771bfa8f770cd0ca621587a4bd8fe92e8049
  uses: sqlitecloud/docsearch-action@v6
  with:
    # The SQLite Cloud project connection string.
    project-string: 
    # Your website's documentation base url.
    base-url: 
    # The name of the database to use on SQLite Cloud, just remeber to create first a database on your project!
    database: 
    # The path of the markdown files, by default it will parse every .md/.mdx file recursively starting from the working directory.
    path: # optional, default is $(pwd)
    # If you want to remove html elements from the search set this to true.
    strip-html: # optional
    # If you want to remove jsx elements from the search set this to true.
    strip-jsx: # optional
    # If you want to avoid redundancy of your markdown titles in the search set this to true.
    strip-md-titles: # optional
    # If you use a front matter and you want the action to convert it to json and send it to the cloud make this true.
    use-front-matter: # optional
    # Use the slug in the header as the path instead of the relative one.
    path-using-slug: # optional- name: Buildalon unity-uwp-builder
  # You may pin to the exact commit or the version.
  # uses: buildalon/unity-uwp-builder@2f16bc56df00670021b9b58e11444c9b6867fc83
  uses: buildalon/unity-uwp-builder@v1.0.4
  with:
    # The directory that contains the exported visual studio project from Unity.
    project-path: 
    # The configuration to use when building the visual studio project. Defaults to `Master`.
    configuration: # optional, default is Master
    # The architecture to use when building the visual studio project. Can be: `x86`, `x64`, `ARM`, or `ARM64`.
    architecture: # optional, default is ARM64
    # Additional arguments to pass to the msbuild command.
    additional-args: # optional
    # The type of package to generate. Can be: `sideload` or `upload`. Defaults to `sideload`.
    package-type: # optional, default is sideload
    # The path to the certificate to use when packaging the UWP project. Required when `package- name: ChartDB Database Sync
  # You may pin to the exact commit or the version.
  # uses: chartdb/chartdb-action@bf0d5213ffaae65d356cfb042b1b0b06e8581c12
  uses: chartdb/chartdb-action@v1.0.0
  with:
    # Database host address
    db-host: 
    # Database port
    db-port: # optional, default is 5432
    # Database name
    db-database: 
    # Database username
    db-username: 
    # Database password (use secrets!)
    db-password: # optional
    # Database type (postgresql, mysql, mariadb, mssql)
    db-type: 
    # ChartDB API token (use secrets!)
    chartdb-api-token: 
    # ChartDB diagram ID to sync with
    chartdb-diagram-id: 
    # Docker network mode
    network: # optional, default is host-type` is `sideload`. Defaults to the Unity generated test certificate.
    certificate-path: # optional
